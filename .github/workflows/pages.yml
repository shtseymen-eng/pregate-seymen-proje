name: pages-build-deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    name: Ana Pregate Sistemi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pregate-presentation:
    name: Pregate Sunum Hazırlama
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: pregate-sunum-hazirlama
      url: https://shtseymen-eng.github.io/pregate-seymen-proje/monthly-presentation/web/
    steps:
      - name: Verify monthly presentation link
        run: >-
          curl --fail --location --silent --show-error
          --retry 6 --retry-all-errors --retry-delay 5
          https://shtseymen-eng.github.io/pregate-seymen-proje/monthly-presentation/web/
          > /dev/null
